worker_processes 1;
events { worker_connections 4096; }

http {
    # Docker compose's service-name DNS resolves ``backend`` to all healthy
    # replica IPs once at nginx startup; nginx round-robins between them.
    # If a backend container is recreated and gets a new IP, reload nginx
    # (``docker compose restart nginx``) — open-source nginx doesn't
    # re-resolve static upstream entries at runtime.
    upstream backend_pool {
        server backend:8000;
        keepalive 64;
    }

    server {
        listen 80;
        client_max_body_size 10m;

        location / {
            proxy_pass http://backend_pool;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support for /ws endpoints
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }
    }
}
