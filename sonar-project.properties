sonar.projectKey=WOMS
sonar.projectName=Smart Order Management
sonar.sourceEncoding=UTF-8

# --- Production code (counts toward LOC / issues / duplication) ---
sonar.sources=backend/app,frontend/src

# --- Test code (analyzed as tests, not production) ---
sonar.tests=backend/tests,frontend/src
sonar.test.inclusions=\
  frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,\
  frontend/src/**/*.spec.ts,frontend/src/**/*.spec.tsx,\
  frontend/src/test/**,\
  backend/tests/**

# --- Keep test/generated/vendored files OUT of production scope ---
sonar.exclusions=\
  frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,\
  frontend/src/**/*.spec.ts,frontend/src/**/*.spec.tsx,\
  frontend/src/test/**,\
  **/__pycache__/**,**/*.d.ts

# --- Global ignore: never index vendored / build / worktree copies ---
sonar.global.exclusions=\
  **/node_modules/**,**/dist/**,**/.venv/**,\
  backend/alembic/**,.claude/**

# --- Python coverage (coverage.xml; <source> rewritten to relative path) ---
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.python.version=3.11

# --- Frontend coverage (vitest v8 lcov; SF paths rewritten to repo-root relative) ---
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# --- Exclude non-testable files from coverage (mock data / app entry points / pkg markers) ---
# (still analyzed for bugs/smells; just not counted in the coverage %)
sonar.coverage.exclusions=\
  **/mockData.ts,**/*.mock.*,\
  frontend/src/main.tsx,\
  backend/app/main.py,**/__init__.py
