# Seeds a default root admin so anyone reviewing the demo can log in.
#
# *** DEMO ONLY ***
# Credentials are hardcoded below and visible to anyone with repo access.
# For prod, remove this Job and create the admin via `kubectl exec` into a
# backend pod, prompting for the password interactively.
#
# Demo credentials:
#   username: admin
#   email:    admin@example.com   (NOT *.local — Pydantic EmailStr rejects
#                                  RFC-reserved TLDs when /auth/me serialises)
#   password: testpassword123
#   role:     root
#
# Runs after `woms-migrate` finishes (the schema must already be in place).
# Uses the backend image because it already ships SQLAlchemy + bcrypt + the
# User model — no separate seed image needed.
#
# The script is "ensure"-style: if `admin` already exists it overwrites
# email / password / role / is_active back to the demo values, so re-running
# the Job after editing credentials actually picks them up.

apiVersion: batch/v1
kind: Job
metadata:
  name: woms-seed-admin
  namespace: woms
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: seed
          image: ${ECR_URI}/woms-backend:v0.1
          envFrom:
            - secretRef:
                name: woms-secrets
            - configMapRef:
                name: woms-config
          command:
            - python
            - -c
            - |
              from app.core.db import SessionLocal
              from app.core.security import hash_password
              from app.models.user import UserRole
              from app.repositories import user as user_repo

              ADMIN_USERNAME = "admin"
              ADMIN_EMAIL    = "admin@example.com"
              ADMIN_PASSWORD = "testpassword123"

              with SessionLocal() as db:
                  existing = user_repo.get_by_username(db, ADMIN_USERNAME)
                  if existing:
                      existing.email = ADMIN_EMAIL
                      existing.password_hash = hash_password(ADMIN_PASSWORD)
                      existing.role = UserRole.root
                      existing.is_active = True
                      db.commit()
                      print(f"[seed] updated existing admin {ADMIN_USERNAME!r}")
                  else:
                      user_repo.create(
                          db,
                          username=ADMIN_USERNAME,
                          password_hash=hash_password(ADMIN_PASSWORD),
                          role=UserRole.root,
                          email=ADMIN_EMAIL,
                      )
                      db.commit()
                      print(f"[seed] created root admin {ADMIN_USERNAME!r}")
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
