# Non-secret config consumed by the backend + worker pods.
#
# Secrets (DATABASE_URL, REDIS_URL, JWT_SECRET) live in a Secret created
# imperatively from Terraform outputs — see k8s/README.md.

apiVersion: v1
kind: ConfigMap
metadata:
  name: woms-config
  namespace: woms
data:
  APP_ENV: "prod"
  LOG_LEVEL: "INFO"
  # CORS: in Phase 4 (ALB Ingress) the frontend and backend will share a
  # domain, so CORS isn't strictly required. For now allow the in-cluster
  # frontend Service's address so a port-forwarded frontend can call backend.
  CORS_ORIGINS: "http://localhost,http://localhost:5173,http://localhost:8080"
  # DB connection pool sizing. RDS db.t3.micro defaults to ~85 max_connections.
  # With 2 backend pods × 30 (pool 20 + overflow 10) + 1 worker × 15 (default)
  # + ~5 for admin / healthcheck / migration jobs = ~80 → leaves headroom
  # below the 85 ceiling. Raising further requires upgrading the RDS class
  # (db.t3.small → ~170 max_connections) or adding PgBouncer in front.
  DB_POOL_SIZE: "20"
  DB_MAX_OVERFLOW: "10"
