# Frontend (nginx serving the pre-built /dist) Deployment.
#
# Two replicas, no env vars — the API URL is relative (`/api/v1/...`) so the
# frontend doesn't need to know the backend's address at build time. In
# Phase 4 the ALB Ingress routes `/api/*` → backend Service and everything
# else → frontend Service.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: woms
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: ${ECR_URI}/woms-frontend:v0.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
