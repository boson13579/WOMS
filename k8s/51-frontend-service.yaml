# In-cluster address for the frontend pods. Phase 4 ALB Ingress will route
# external traffic here.

apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: woms
  labels:
    app: frontend
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
